name: static-graphics-windows

on:
  workflow_call:
    inputs:
      skiasharp_version:
        required: true
        type: string
      angle_branch:
        required: false
        default: "8059"
        type: string
  workflow_dispatch:
    inputs:
      skiasharp_version:
        required: true
        default: "4.154.0-preview.1"
        type: string
      angle_branch:
        required: false
        default: "8059"
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            target_cpu: x64
            msvc_arch: x64
          - rid: win-arm64
            target_cpu: arm64
            msvc_arch: amd64_arm64
    runs-on: windows-2022
    env:
      SKIASHARP_VERSION: ${{ inputs.skiasharp_version }}
      ANGLE_BRANCH: ${{ inputs.angle_branch }}
    steps:
      - uses: actions/checkout@v4
      - name: Exclude Workspace from Windows Defender
        shell: powershell
        run: |
          try {
              Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop
              Write-Host "Successfully added workspace to Defender exclusions."
          } catch {
              Write-Host "Note: Defender exclusion skipped or restricted on this runner type: $_"
          }
      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: External/NativeStatic/.work
          key: native-work-windows-${{ matrix.rid }}-${{ inputs.skiasharp_version }}-${{ inputs.angle_branch }}-${{ hashFiles('External/NativeStatic/patches/*.patch', 'scripts/build-windows-static-graphics.ps1') }}

      - name: Install Windows 11 SDK 28000
        id: install-sdk
        background: true
        shell: pwsh
        run: |
          & "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\vs_installer.exe" modify `
              --installPath "${env:ProgramFiles}\Microsoft Visual Studio\2022\Enterprise" `
              --add Microsoft.VisualStudio.Component.Windows11SDK.28000 `
              --quiet --wait --norestart
          
          $sdkPath = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.28000.0"
          if (-not (Test-Path "$sdkPath\um")) {
              throw "SDK 28000 headers still missing at $sdkPath\um"
          }
                  

      - name: Install native build dependencies
        shell: pwsh
        run: |
          git config --global core.longpaths true
          choco install ninja llvm -y
    

      - name: Build Windows static graphics libraries (Skia)
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
          TARGET_CPU: ${{ matrix.target_cpu }}
          DEPOT_TOOLS_WIN_TOOLCHAIN: 0
          GYP_MSVS_VERSION: 18.0
        run: .\scripts\build-windows-static-graphics.ps1 skia

      - name: Validate Windows ANGLE inputs
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
          TARGET_CPU: ${{ matrix.target_cpu }}
          DEPOT_TOOLS_WIN_TOOLCHAIN: 0
          GYP_MSVS_VERSION: 18.0
        run: .\scripts\build-windows-static-graphics.ps1 angle-preflight

      - name: Wait for WinSDK
        wait: install-sdk

      - name: Setup MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.msvc_arch }}
          sdk: 10.0.28000.0

      - name: Configure Chromium Visual Studio environment
        shell: pwsh
        run: |
          "DEPOT_TOOLS_WIN_TOOLCHAIN=0" >> $env:GITHUB_ENV
          "GYP_MSVS_VERSION=18.0" >> $env:GITHUB_ENV
          "GYP_MSVS_OVERRIDE_PATH=$($env:VSINSTALLDIR.TrimEnd('\', '/'))" >> $env:GITHUB_ENV

      - name: Build Windows static graphics libraries (ANGLE)
        shell: pwsh
        env:
          RID: ${{ matrix.rid }}
          TARGET_CPU: ${{ matrix.target_cpu }}
          DEPOT_TOOLS_WIN_TOOLCHAIN: 0
          GYP_MSVS_VERSION: 18.0
        run: .\scripts\build-windows-static-graphics.ps1 angle

      - name: Upload Windows static archives
        uses: actions/upload-artifact@v4
        with:
          name: native-static-${{ matrix.rid }}
          path: External/NativeStatic/${{ matrix.rid }}/*
          if-no-files-found: error
