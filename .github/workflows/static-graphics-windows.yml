name: static-graphics-windows

on:
  workflow_call:
    inputs:
      skiasharp_version:
        required: true
        type: string
      angle_branch:
        required: false
        default: "8059"
        type: string
  workflow_dispatch:
    inputs:
      skiasharp_version:
        required: true
        default: "4.154.0-preview.1"
        type: string
      angle_branch:
        required: false
        default: "8059"
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            target_cpu: x64
            msvc_arch: x64
          - rid: win-arm64
            target_cpu: arm64
            msvc_arch: amd64_arm64
    runs-on: windows-2022
    env:
      SKIASHARP_VERSION: ${{ inputs.skiasharp_version }}
      ANGLE_BRANCH: ${{ inputs.angle_branch }}
      CC: clang-cl
      CXX: clang-cl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exclude Workspace from Windows Defender
        shell: powershell
        run: |
          try {
              Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction Stop
              Write-Host "Successfully added workspace to Defender exclusions."
          } catch {
              Write-Host "Note: Defender exclusion skipped or restricted on this runner type: $_"
          }

      - name: Install Windows SDK 28000
        id: install-sdk
        background: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Downloading Windows SDK 28000 installer..."
          
          $installerPath = "$env:TEMP\winsdk_setup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2376217" -OutFile $installerPath
          
          Write-Host "Installing Windows SDK..."
          Start-Process -FilePath $installerPath -ArgumentList "/features", "+", "/q", "/norestart" -NoNewWindow -Wait
          
          $sdkPath = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.28000.0"
          if (-not (Test-Path "$sdkPath\um")) {
              throw "SDK headers still missing at $sdkPath\um"
          }
      - name: Install native build dependencies
        shell: pwsh
        run: |
          git config --global core.longpaths true
          choco install ninja llvm -y
    

      - name: Build Windows static graphics libraries (Skia)
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          TARGET_CPU: ${{ matrix.target_cpu }}
          DEPOT_TOOLS_WIN_TOOLCHAIN: 0
          GYP_MSVS_VERSION: 17.0
        run: ./scripts/build-static-graphics.sh skia

      - name: Wait for WinSDK
        wait: install-sdk

      - name: Setup MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@368ef7d1ee4d1171b31d4a7f67f4d954f903f5a9 # v4.1.0
        with:
          arch: ${{ matrix.msvc_arch }}
          sdk: 10.0.28000.0

      - name: Configure Chromium Visual Studio environment
        shell: pwsh
        run: |
          "DEPOT_TOOLS_WIN_TOOLCHAIN=0" >> $env:GITHUB_ENV
          "GYP_MSVS_VERSION=17.0" >> $env:GITHUB_ENV
          "GYP_MSVS_OVERRIDE_PATH=$($env:VSINSTALLDIR.TrimEnd('\', '/'))" >> $env:GITHUB_ENV

      - name: Build Windows static graphics libraries (ANGLE)
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          TARGET_CPU: ${{ matrix.target_cpu }}
          DEPOT_TOOLS_WIN_TOOLCHAIN: 0
          GYP_MSVS_VERSION: 17.0
        run: ./scripts/build-static-graphics.sh angle

      - name: Upload Windows static archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-static-${{ matrix.rid }}
          path: External/NativeStatic/${{ matrix.rid }}/*
          if-no-files-found: error
