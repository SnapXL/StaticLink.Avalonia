name: static-graphics-musl

on:
  workflow_call:
    inputs:
      skiasharp_version:
        required: true
        type: string
      dotnet_alpine_image:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      skiasharp_version:
        required: true
        default: "4.154.0-preview.1"
        type: string
      dotnet_alpine_image:
        required: true
        default: mcr.microsoft.com/dotnet/sdk:10.0-alpine3.22
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-musl-x64
            target_cpu: x64
            alpine_arch: x86_64
            runner: ubuntu-24.04
          - rid: linux-musl-arm64
            target_cpu: arm64
            alpine_arch: aarch64
            runner: ubuntu-24.04-arm
          - rid: linux-musl-arm
            target_cpu: arm
            alpine_arch: armv7
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      SKIASHARP_VERSION: ${{ inputs.skiasharp_version }}
      DOTNET_ALPINE_IMAGE: ${{ inputs.dotnet_alpine_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: External/NativeStatic/.work
          key: native-work-musl-${{ matrix.rid }}-${{ inputs.skiasharp_version }}-${{ hashFiles('External/NativeStatic/patches/*.patch', 'scripts/build-linux-static-graphics.sh') }}

      - uses: bgilbert/setup-alpine@armv7
        with:
          arch: ${{ matrix.alpine_arch }}
          branch: v3.21
          packages: >
            ca-certificates
            clang
            compiler-rt
            curl
            fontconfig-dev
            g++
            git
            glib-dev
            gn
            libx11-dev
            libxcb-dev
            libxext-dev
            linux-headers
            lld
            llvm
            mesa-dev
            ninja
            patch
            pciutils-dev
            perl
            pkgconf
            python3
            tar
            xz

      - name: Build Linux musl static graphics libraries
        shell: alpine.sh {0}
        env:
          RID: ${{ matrix.rid }}
          TARGET_CPU: ${{ matrix.target_cpu }}
          OUTPUT_DIR: External/NativeStatic/${{ matrix.rid }}/native
          LLVM_AR: llvm-ar
          DEPOT_TOOLS_BOOTSTRAP_PYTHON3: 0
          VPYTHON_BYPASS: "manually managed python not supported by chrome operations"
        run: scripts/build-linux-static-graphics.sh all

      - name: Upload Linux musl static archives
        uses: actions/upload-artifact@v4
        with:
          name: native-static-${{ matrix.rid }}
          path: External/NativeStatic/${{ matrix.rid }}/*
          if-no-files-found: error
