name: static-graphics-musl

on:
  workflow_call:
    inputs:
      skiasharp_version:
        required: true
        type: string
      dotnet_alpine_image:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      skiasharp_version:
        required: true
        default: "4.155.0-preview.2"
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-musl-x64
            target_cpu: x64
            alpine_arch: x86_64
            runner: ubuntu-24.04
          - rid: linux-musl-arm64
            target_cpu: arm64
            alpine_arch: aarch64
            runner: ubuntu-24.04-arm
          - rid: linux-musl-arm
            target_cpu: arm
            alpine_arch: armv7
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      SKIASHARP_VERSION: ${{ inputs.skiasharp_version }}
      DOTNET_ALPINE_IMAGE: ${{ inputs.dotnet_alpine_image }}
      RID: ${{ matrix.rid }}
      TARGET_CPU: ${{ matrix.target_cpu }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore native build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: External/NativeStatic/.work
          key: native-work-musl-${{ matrix.rid }}-${{ inputs.skiasharp_version }}-${{ hashFiles('External/NativeStatic/patches/*.patch', 'scripts/build-linux-static-graphics.sh') }}

      - name: Install cross-compilation host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm ninja-build curl xz-utils pkg-config python3 gn libfontconfig1-dev

      - name: Set up QEMU
        if: matrix.rid == 'linux-musl-arm'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Alpine Linux 3.19 Sysroot
        env:
          RID: ${{ matrix.rid }}
          TARGET_CPU: ${{ matrix.target_cpu }}
          ALPINE_ARCH: ${{ matrix.alpine_arch }}
        run: scripts/infra/setup-sysroot-musl.sh

      - name: Build Linux musl static graphics libraries
        env:
          PATH: /usr/local/bin:/usr/bin:/bin
          CC: /usr/local/bin/clang
          CXX: /usr/local/bin/clang++
          RID: ${{ matrix.rid }}
          TARGET_CPU: ${{ matrix.target_cpu }}
          OUTPUT_DIR: External/NativeStatic/${{ matrix.rid }}/native
          LLVM_AR: llvm-ar
          DEPOT_TOOLS_BOOTSTRAP_PYTHON3: 0
          VPYTHON_BYPASS: "manually managed python not supported by chrome operations"
        run: scripts/build-static-graphics.sh all

      - name: Upload Linux musl static archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-static-${{ matrix.rid }}
          path: External/NativeStatic/${{ matrix.rid }}/*
          if-no-files-found: error