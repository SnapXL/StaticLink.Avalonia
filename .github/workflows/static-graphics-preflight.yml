name: static-graphics-preflight

on:
  workflow_call:
    outputs:
      package_version:
        value: ${{ jobs.validate.outputs.package_version }}
      skiasharp_version:
        value: ${{ jobs.validate.outputs.skiasharp_version }}
      angle_branch:
        value: ${{ jobs.validate.outputs.angle_branch }}
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.versions.outputs.package_version }}
      skiasharp_version: ${{ steps.versions.outputs.skiasharp_version }}
      angle_branch: ${{ steps.versions.outputs.angle_branch }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.302"

      - name: Read and validate versions
        id: versions
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          
          project = pathlib.Path("NuGet/StaticGraphics/StaticLink.Avalonia.csproj")
          root = ET.parse(project).getroot()
          package_version = root.findtext(".//Version").strip()
          skia_reference = next(
              item.attrib["Version"]
              for item in root.findall(".//PackageReference")
              if item.attrib.get("Include") == "SkiaSharp"
          ).strip()
          
          if package_version.startswith(skia_reference):
              # Remove skia_reference and any leading separator (like '-' or '.')
              angle_branch = package_version[len(skia_reference):].lstrip("-.")
          else:
              angle_branch = ""
          
          print(f"Parsed Package Version: {package_version}")
          print(f"Parsed SkiaSharp Version: {skia_reference}")
          print(f"Parsed Angle Branch: {angle_branch}")
          
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              expected_tag = f"v{package_version}"
          
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"package_version={package_version}\n")
              output.write(f"skiasharp_version={skia_reference}\n")
              output.write(f"angle_branch={angle_branch}\n")
          PY
      - name: Compile smoke project
        run: dotnet build Smoke/AvaloniaStaticLinkSmoke/AvaloniaStaticLinkSmoke.csproj -c Release -p:PublishAot=false
