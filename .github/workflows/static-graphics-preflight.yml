name: static-graphics-preflight

on:
  workflow_call:
    outputs:
      package_version:
        value: ${{ jobs.validate.outputs.package_version }}
      skiasharp_version:
        value: ${{ jobs.validate.outputs.skiasharp_version }}
      angle_branch:
        value: ${{ jobs.validate.outputs.angle_branch }}
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.versions.outputs.package_version }}
      skiasharp_version: ${{ steps.versions.outputs.skiasharp_version }}
      angle_branch: ${{ steps.versions.outputs.angle_branch }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Read and validate versions
        id: versions
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import xml.etree.ElementTree as ET
          
          project = pathlib.Path("NuGet/StaticGraphics/StaticLink.Avalonia.csproj")
          root = ET.parse(project).getroot()
          raw_version = root.findtext(".//Version").strip()
          
          # Extract clean base version (e.g., 4.154.0-preview.1 from 4.154.0-preview.1.26454.9)
          match = re.match(r"^(\d+\.\d+\.\d+(-preview\.\d+)?)", raw_version)
          skiasharp_version = match.group(1) if match else raw_version
          
          package_version = raw_version
          angle_branch = raw_version[len(skiasharp_version):].lstrip("-.")
          
          print(f"Full Package Version: {package_version}")
          print(f"Clean SkiaSharp Version: {skiasharp_version}")
          print(f"Angle Branch / Extra Suffix: {angle_branch}")
          
          if os.environ.get("GITHUB_REF_TYPE") == "tag":
              expected_tag = f"v{package_version}"
          
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"package_version={package_version}\n")
              output.write(f"skiasharp_version={skiasharp_version}\n")
              output.write(f"angle_branch={angle_branch}\n")
          PY
      - name: Compile smoke project
        run: dotnet build Smoke/AvaloniaStaticLinkSmoke/AvaloniaStaticLinkSmoke.csproj -c Release -p:PublishAot=false
