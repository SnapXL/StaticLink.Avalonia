name: static-graphics-linux

on:
  workflow_call:
    inputs:
      skiasharp_version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      skiasharp_version:
        required: true
        default: "4.154.0-preview.1"
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            target_cpu: x64
            ubuntu_arch: amd64
            runner: ubuntu-26.04
          - rid: linux-arm64
            target_cpu: arm64
            ubuntu_arch: arm64
            runner: ubuntu-26.04-arm
          - rid: linux-arm
            target_cpu: arm
            ubuntu_arch: armhf
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      SKIASHARP_VERSION: ${{ inputs.skiasharp_version }}
      RID: ${{ matrix.rid }}
      TARGET_CPU: ${{ matrix.target_cpu }}
      PATH: /usr/local/bin:/usr/bin:/bin
      CC: /usr/local/bin/clang
      CXX: /usr/local/bin/clang++
      LLVM_AR: llvm-ar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap clang lld llvm g++ gn ninja-build pkg-config libfontconfig1-dev libglib2.0-dev libgl1-mesa-dev libpci-dev libx11-dev libxcb1-dev libxext-dev

      - name: Set up QEMU
        if: matrix.rid == 'linux-arm'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Ubuntu 18.04 Sysroot
        env:
          UBUNTU_ARCH: ${{ matrix.ubuntu_arch }}
        run: scripts/infra/setup-sysroot-linux.sh

      - name: Restore native build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: External/NativeStatic/.work
          key: native-work-linux-${{ matrix.rid }}-${{ inputs.skiasharp_version }}-${{ hashFiles('External/NativeStatic/patches/*.patch', 'scripts/build-linux-static-graphics.sh') }}

      - name: Build Linux static graphics libraries
        run: scripts/build-static-graphics.sh all

      - name: Upload Linux static archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-static-${{ matrix.rid }}
          path: External/NativeStatic/${{ matrix.rid }}/*
          if-no-files-found: error
