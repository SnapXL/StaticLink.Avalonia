name: static-graphics-linux

on:
  workflow_call:
    inputs:
      skiasharp_version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      skiasharp_version:
        required: true
        default: "4.154.0-preview.1"
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            target_cpu: x64
            ubuntu_arch: amd64
            runner: ubuntu-26.04
          - rid: linux-arm64
            target_cpu: arm64
            ubuntu_arch: arm64
            runner: ubuntu-26.04-arm
          - rid: linux-arm
            target_cpu: arm
            ubuntu_arch: armhf
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      SKIASHARP_VERSION: ${{ inputs.skiasharp_version }}
      RID: ${{ matrix.rid }}
      TARGET_CPU: ${{ matrix.target_cpu }}
      LLVM_AR: llvm-ar
    steps:
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap clang lld llvm g++ gn ninja-build pkg-config libfontconfig1-dev libglib2.0-dev libgl1-mesa-dev libpci-dev libx11-dev libxcb1-dev libxext-dev

      - name: Set up QEMU
        if: matrix.rid == 'linux-arm'
        uses: docker/setup-qemu-action@v4

      - name: Setup Ubuntu 18.04 Sysroot
        run: |
          if [ "${{ matrix.ubuntu_arch }}" = "amd64" ]; then
            MIRROR="http://archive.ubuntu.com/ubuntu"
          else
            MIRROR="http://ports.ubuntu.com/ubuntu-ports"
          fi
          sudo debootstrap \
            --arch=${{ matrix.ubuntu_arch }} \
            --components=main,universe \
            --include=libc6-dev,libfontconfig1-dev,libfreetype6-dev,zlib1g-dev,gnupg \
            bionic \
            /opt/sysroot-ubuntu1804 \
            $MIRROR

          sudo chroot /opt/sysroot-ubuntu1804 apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 2C277A0A352154E5 1E9377A2BA9EF27F
          echo "deb http://ppa.launchpad.net/ubuntu-toolchain-r/test/ubuntu bionic main" | sudo tee -a /opt/sysroot-ubuntu1804/etc/apt/sources.list
          
          sudo chroot /opt/sysroot-ubuntu1804 apt-get update
          sudo chroot /opt/sysroot-ubuntu1804 apt-get install -y libstdc++-10-dev

      - name: Setup Clang/Clang++ Wrappers for Sysroot
        run: |
          TRIPLE=$(sudo chroot /opt/sysroot-ubuntu1804 dpkg-architecture -qDEB_HOST_GNU_TYPE)
          CXX_INCLUDE_DIR="/opt/sysroot-ubuntu1804/usr/include/$TRIPLE/c++/10"
          SYSROOT="/opt/sysroot-ubuntu1804"

          sudo tee /usr/local/bin/clang << EOF
          #!/bin/sh
          exec /usr/bin/clang --target=$TRIPLE --sysroot=$SYSROOT -isystem$CXX_INCLUDE_DIR -isystem$SYSROOT/usr/include/c++/10 "\$@"
          EOF
          sudo chmod +x /usr/local/bin/clang

          sudo tee /usr/local/bin/clang++ << EOF
          #!/bin/sh
          exec /usr/bin/clang++ --target=$TRIPLE --sysroot=$SYSROOT -isystem$CXX_INCLUDE_DIR -isystem$SYSROOT/usr/include/c++/10 "\$@"
          EOF
          sudo chmod +x /usr/local/bin/clang++

      - uses: actions/checkout@v4

      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: External/NativeStatic/.work
          key: native-work-linux-${{ matrix.rid }}-${{ inputs.skiasharp_version }}-${{ hashFiles('External/NativeStatic/patches/*.patch', 'scripts/build-linux-static-graphics.sh') }}

      - name: Build Linux static graphics libraries
        run: scripts/build-linux-static-graphics.sh all

      - name: Upload Linux static archives
        uses: actions/upload-artifact@v4
        with:
          name: native-static-${{ matrix.rid }}
          path: External/NativeStatic/${{ matrix.rid }}/*
          if-no-files-found: error
