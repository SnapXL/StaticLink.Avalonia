name: static-graphics-linux

on:
  workflow_call:
    inputs:
      skiasharp_version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      skiasharp_version:
        required: true
        default: "4.154.0-preview.1"
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            target_cpu: x64
            runner: ubuntu-26.04
          - rid: linux-arm64
            target_cpu: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    # Used for its old glibc
    container: almalinux:8-minimal
    env:
      SKIASHARP_VERSION: ${{ inputs.skiasharp_version }}
      RID: ${{ matrix.rid }}
      TARGET_CPU: ${{ matrix.target_cpu }}
      LLVM_AR: llvm-ar
    steps:
      - name: Install native build dependencies
        run: |
          sed -i 's/enabled=0/enabled=1/g' /etc/yum.repos.d/almalinux-powertools.repo || true
          microdnf install -y epel-release
          microdnf install -y git clang lld llvm gcc-c++ ninja-build pkgconfig fontconfig-devel glib2-devel mesa-libGL-devel pciutils-devel libX11-devel libxcb-devel libXext-devel tar
      - uses: actions/checkout@v4

      - name: Restore native build cache
        uses: actions/cache@v4
        with:
          path: External/NativeStatic/.work
          key: native-work-linux-${{ matrix.rid }}-${{ inputs.skiasharp_version }}-${{ hashFiles('External/NativeStatic/patches/*.patch', 'scripts/build-linux-static-graphics.sh') }}

      - name: Build Linux static graphics libraries
        run: scripts/build-linux-static-graphics.sh all

      - name: Upload Linux static archives
        uses: actions/upload-artifact@v4
        with:
          name: native-static-${{ matrix.rid }}
          path: External/NativeStatic/${{ matrix.rid }}/*
          if-no-files-found: error
