name: static-graphics-freebsd

on:
  workflow_call:
    inputs:
      skiasharp_version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      skiasharp_version:
        required: true
        default: "4.155.0-preview.2"
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: freebsd-x64
            target_cpu: x64
            freebsd_arch: x86_64
            freebsd_dir: amd64/amd64
            target_triple: x86_64-unknown-freebsd14
          - rid: freebsd-arm64
            target_cpu: arm64
            freebsd_arch: aarch64
            freebsd_dir: arm64/aarch64
            target_triple: aarch64-unknown-freebsd14
    runs-on: ubuntu-26.04
    env:
      SKIASHARP_VERSION: ${{ inputs.skiasharp_version }}
      RID: ${{ matrix.rid }}
      TARGET_CPU: ${{ matrix.target_cpu }}
      FREEBSD_TRIPLE: ${{ matrix.target_triple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore native build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: External/NativeStatic/.work
          key: native-work-freebsd-${{ matrix.rid }}-${{ inputs.skiasharp_version }}-${{ hashFiles('External/NativeStatic/patches/*.patch', 'scripts/build-freebsd-static-graphics.sh') }}

      - name: Install cross-compilation host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm ninja-build curl xz-utils pkg-config python3 gn libfontconfig1-dev

      - name: Setup FreeBSD Sysroot
        env:
          RID: ${{ matrix.rid }}
          FREEBSD_DIR: ${{ matrix.freebsd_dir }}
          FREEBSD_TRIPLE: ${{ matrix.target_triple }}
        run: scripts/infra/setup-sysroot-freebsd.sh

      - name: Build FreeBSD static graphics libraries
        env:
          CC: clang
          CXX: clang++
          AR: llvm-ar
          LD: ld.lld
          TARGET_OS: freebsd
        run: |
          scripts/build-static-graphics.sh all

      - name: Upload FreeBSD static archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-static-${{ matrix.rid }}
          path: External/NativeStatic/${{ matrix.rid }}/*
          if-no-files-found: error